<header class="catalyst-header">

  <style>
    .catalyst-header {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 40%, rgba(255,199,44,.10), transparent 30%),
        radial-gradient(circle at 82% 55%, rgba(65,120,72,.13), transparent 32%),
        linear-gradient(135deg, #050505 0%, #111111 48%, #050505 100%);
      color: white;
      padding: 3.2rem 1rem 3rem;
      border-bottom: 5px solid #FFC72C;
      isolation: isolate;
    }

    /* Subtle atmospheric glow */
    .catalyst-header::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 25% 20%,
          rgba(255,255,255,.06), transparent 20%),
        radial-gradient(circle at 75% 80%,
          rgba(255,199,44,.06), transparent 25%);
      z-index: 0;
      pointer-events: none;
    }

    .catalyst-molecules {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: .88;
      pointer-events: none;
    }

    .catalyst-header-content {
      position: relative;
      z-index: 5;
      max-width: 950px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .catalyst-main-title {
      margin: 0;
      color: #ffffff;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 850;
      letter-spacing: 1.5px;
      line-height: 1.1;
      text-shadow:
        0 0 8px rgba(255,255,255,.10),
        0 3px 18px rgba(0,0,0,.8);
    }

    .catalyst-director {
      display: inline-block;
      margin-left: .65rem;
      color: #FFC72C;
      font-size: clamp(.95rem, 2vw, 1.15rem);
      font-weight: 600;
      letter-spacing: .3px;
    }

    .catalyst-subtitle {
      margin-top: .8rem;
      color: #e7e7e7;
      font-size: 1.05rem;
      font-weight: 400;
      line-height: 1.6;
      max-width: 850px;
      text-shadow: 0 2px 8px rgba(0,0,0,.9);
    }

    .catalyst-subtitle b {
      color: #FFC72C;
      font-size: 1.14rem;
      font-weight: 800;
    }

    /* Molecular motion */
    @keyframes catalystFloatLeft {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-6px) rotate(1.2deg);
      }
    }

    @keyframes catalystFloatRight {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(7px) rotate(-1.2deg);
      }
    }

    @keyframes catalystGlow {
      0%, 100% {
        opacity: .78;
      }
      50% {
        opacity: 1;
      }
    }

    .catalyst-mol-left {
      animation: catalystFloatLeft 7s ease-in-out infinite;
      transform-origin: center;
    }

    .catalyst-mol-right {
      animation: catalystFloatRight 8s ease-in-out infinite;
      transform-origin: center;
    }

    .catalyst-glow {
      animation: catalystGlow 2.8s ease-in-out infinite;
    }

    @media (max-width: 700px) {
      .catalyst-header {
        padding: 2.4rem .5rem 2.3rem;
      }

      .catalyst-director {
        display: block;
        margin-left: 0;
        margin-top: .45rem;
      }

      .catalyst-subtitle {
        font-size: .93rem;
      }
    }
  </style>


  <!-- GLOWING MOLECULAR BACKGROUND -->

  <svg
    class="catalyst-molecules"
    viewBox="0 0 1200 240"
    preserveAspectRatio="xMidYMid slice"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >

    <defs>

      <!-- GOLD -->
      <radialGradient id="catGold" cx="32%" cy="28%" r="72%">
        <stop offset="0%" stop-color="#FFFBE6"/>
        <stop offset="25%" stop-color="#FFE889"/>
        <stop offset="60%" stop-color="#FFC72C"/>
        <stop offset="100%" stop-color="#8A6500"/>
      </radialGradient>

      <!-- GREEN -->
      <radialGradient id="catGreen" cx="32%" cy="28%" r="72%">
        <stop offset="0%" stop-color="#EAF6E8"/>
        <stop offset="30%" stop-color="#8DBE82"/>
        <stop offset="65%" stop-color="#4B7F52"/>
        <stop offset="100%" stop-color="#193A20"/>
      </radialGradient>

      <!-- WHITE -->
      <radialGradient id="catWhite" cx="32%" cy="28%" r="72%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="55%" stop-color="#F1F1F1"/>
        <stop offset="100%" stop-color="#888888"/>
      </radialGradient>

      <!-- BLACK / CHARCOAL -->
      <radialGradient id="catBlack" cx="30%" cy="25%" r="72%">
        <stop offset="0%" stop-color="#777777"/>
        <stop offset="40%" stop-color="#252525"/>
        <stop offset="100%" stop-color="#030303"/>
      </radialGradient>


      <!-- GOLD GLOW -->
      <filter id="catGoldGlow"
              x="-100%" y="-100%"
              width="300%" height="300%">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feFlood flood-color="#FFC72C"
                 flood-opacity=".95"
                 result="glowColor"/>
        <feComposite in="glowColor"
                     in2="blur"
                     operator="in"
                     result="softGlow"/>
        <feMerge>
          <feMergeNode in="softGlow"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>


      <!-- WHITE GLOW -->
      <filter id="catWhiteGlow"
              x="-100%" y="-100%"
              width="300%" height="300%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feFlood flood-color="#FFFFFF"
                 flood-opacity=".85"
                 result="glowColor"/>
        <feComposite in="glowColor"
                     in2="blur"
                     operator="in"
                     result="softGlow"/>
        <feMerge>
          <feMergeNode in="softGlow"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>


      <!-- GREEN GLOW -->
      <filter id="catGreenGlow"
              x="-100%" y="-100%"
              width="300%" height="300%">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feFlood flood-color="#659B68"
                 flood-opacity=".9"
                 result="glowColor"/>
        <feComposite in="glowColor"
                     in2="blur"
                     operator="in"
                     result="softGlow"/>
        <feMerge>
          <feMergeNode in="softGlow"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

    </defs>

    <!-- LEFT MOLECULAR NETWORK                 -->
    <!-- ====================================== -->

      <!-- Bonds -->

        fill="none"
        stroke-linecap="round"
        opacity=".92"
      >

        <line x1="20" y1="42"
              x2="82" y2="82"
              stroke="#FFFFFF"
              stroke-width="2"/>

        <line x1="82" y1="82"
              x2="145" y2="38"
              stroke="#FFC72C"
              stroke-width="2.8"/>

        <line x1="82" y1="82"
              x2="118" y2="150"
              stroke="#557F59"
              stroke-width="2.4"/>

              stroke="#FFFFFF"
              stroke-width="2"/>

        <line x1="210" y1="72"

              stroke="#557F59"
              stroke-width="2.5"/>

        <line x1="210" y1="72"
              x2="255" y2="137"
              stroke="#FFC72C"
              stroke-width="2.8"/>

        <line x1="255" y1="137"
              x2="320" y2="104"
              stroke="#FFFFFF"
              stroke-width="2"/>

        <line x1="320" y1="104"
              x2="382" y2="145"
              stroke="#557F59"
              stroke-width="2.3"/>

        <line x1="320" y1="104"
              x2="365" y2="52"
              stroke="#FFC72C"
              stroke-width="2.5"/>

      </g>


      <!-- Atoms -->

      <circle
        cx="20" cy="42" r="7"
        fill="url(#catBlack)"
        stroke="#FFFFFF"
        stroke-width="1"
      />

      <circle
        cx="82" cy="82" r="13"
        fill="url(#catGold)"
        filter="url(#catGoldGlow)"
        class="catalyst-glow"
      />

      <circle
        cx="145" cy="38" r="9"

        filter="url(#catWhiteGlow)"
      />

      <circle
        cx="118" cy="150" r="9"
        fill="url(#catGreen)"
        filter="url(#catGreenGlow)"
      />

      <circle
        cx="210" cy="72" r="11"
        fill="url(#catBlack)"
        stroke="#FFC72C"
        stroke-width="1.4"
      />

      <circle
        cx="270" cy="35" r="10"
        fill="url(#catGreen)"
        filter="url(#catGreenGlow)"
      />

      <circle
        cx="255" cy="137" r="12"
        fill="url(#catGold)"
        filter="url(#catGoldGlow)"
      />

      <circle
        cx="320" cy="104" r="9"
        fill="url(#catWhite)"
        filter="url(#catWhiteGlow)"
      />

      <circle
        cx="382" cy="145" r="7"
        fill="url(#catBlack)"
        stroke="#FFFFFF"
        stroke-width="1"
      />

      <circle
        cx="365" cy="52" r="8"
        fill="url(#catGold)"
        filter="url(#catGoldGlow)"
      />

    </g>


    <!-- ====================================== -->
    <!-- RIGHT MOLECULAR NETWORK                -->
    <!-- ====================================== -->

    <g class="catalyst-mol-right">

      <!-- Ring -->

      <polygon

          870,48

          980,55

      />


      <!-- Bonds -->

      <g

      >

        <line

        />

        <line

        />

        <line

        />

        <line

        />

        <line

          stroke="#FFFFFF"
          stroke-width="2"
        />

      </g>


      <!-- Atoms -->

      <circle
        cx="870" cy="48" r="9"
        fill="url(#catBlack)"
        stroke="#FFFFFF"
        stroke-width="1"
      />

      <circle
        cx="925" cy="25" r="12"
        fill="url(#catGold)"
        filter="url(#catGoldGlow)"
        class="catalyst-glow"
      />

      <circle
        cx="980" cy="55" r="10"

        filter="url(#catWhiteGlow)"
      />

      <circle
        cx="980" cy="116" r="11"
        fill="url(#catGreen)"
        filter="url(#catGreenGlow)"
      />

      <circle
        cx="925" cy="148" r="9"
        fill="url(#catBlack)"
        stroke="#FFC72C"
        stroke-width="1.4"
      />

      <circle
        cx="870" cy="116" r="10"
        fill="url(#catWhite)"
        filter="url(#catWhiteGlow)"
      />

      <circle
        cx="810" cy="155" r="8"
        fill="url(#catGold)"
        filter="url(#catGoldGlow)"
      />

      <circle
        cx="1010" cy="22" r="8"
        fill="url(#catBlack)"

        stroke-width="1"
      />

      <circle
        cx="1045" cy="82" r="13"

        filter="url(#catGoldGlow)"
      />

      <circle

      />

      />

  </svg>


  <!-- HEADER TEXT -->

  <div class="catalyst-header-content">

    <h1 class="catalyst-main-title">
      CATALYST LAB
      <span class="catalyst-director">
        | Directed by Dr. Lexi Hwang
      </span>
    </h1>

    <div class="catalyst-subtitle">
      <b>C</b>ollaborative
      <b>A</b>dvancement of
      <b>T</b>eaching,
      <b>A</b>ccess, and
      <b>L</b>earning for
      <b>Y</b>outh
      <b>S</b>TEM
      <b>T</b>ransformation
    </div>

  </div>

</header>
